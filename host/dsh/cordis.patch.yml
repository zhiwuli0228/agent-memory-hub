# dsh-agent-memory-hub bundle patch: one host plugin row.
# root: '' (empty) means the hub directory resolves from $MEMHUB_ROOT, or the
# session working directory when it contains a hub (hub.yaml), else synthetic.
# Point it at a fixed hub by overriding this row's config in your own profile
# patch, e.g.:
#   - override:
#       id: agent-memory-hub-dsh
#       config:
#         root: 'C:\mem\my-hub'
# Coexisting with the legacy dsh-memory-hub plugin? Add `toolConflict: suffix`
# so tools register as memory_*__amh instead of erroring on name clashes.
- insert:
    - id: agent-memory-hub-dsh
      name: agent-memory-hub-dsh
      config:
        root: ''
