<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>memhub console</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e14;
    --bg-soft: #10141d;
    --panel: #151a26;
    --panel-2: #1a2030;
    --border: #232b3d;
    --border-soft: #1d2434;
    --text: #e8ecf4;
    --text-dim: #8b95ad;
    --text-faint: #5c6579;
    --brand: #4d7cff;
    --brand-2: #7aa2ff;
    --ok: #3fb950;
    --danger: #f85149;
    --warn: #d29922;
    --individual: #ff9e9e;
    --batch: #8ee39b;
    --radius: 12px;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(77, 124, 255, .14), transparent 60%),
      radial-gradient(900px 600px at 110% 0%, rgba(63, 185, 80, .08), transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--border-soft);
    backdrop-filter: blur(8px); background: rgba(11, 14, 20, .7);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { display: block; }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: .2px; font-weight: 650; }
  .brand .sub { color: var(--text-faint); font-size: 12px; margin-top: 1px; }
  .status {
    font-size: 12px; color: var(--text-dim);
    background: var(--panel); border: 1px solid var(--border-soft);
    padding: 6px 12px; border-radius: 999px; max-width: 55%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  nav {
    display: flex; gap: 4px; padding: 0 28px;
    border-bottom: 1px solid var(--border-soft); background: rgba(11, 14, 20, .5);
  }
  nav button {
    border: none; background: none; color: var(--text-dim);
    padding: 12px 16px; font-size: 13.5px; cursor: pointer;
    border-bottom: 2px solid transparent; font-family: var(--font);
    transition: color .15s, border-color .15s;
    display: flex; align-items: center; gap: 7px;
  }
  nav button:hover { color: var(--text); }
  nav button.active { color: var(--text); border-bottom-color: var(--brand); }
  nav .count {
    background: var(--brand); color: #fff; font-size: 11px; font-weight: 600;
    border-radius: 999px; padding: 1px 7px; min-width: 18px; text-align: center;
  }
  main { max-width: 960px; margin: 0 auto; padding: 24px 28px 60px; }
  .tabpane { display: none; animation: fade .18s ease; }
  .tabpane.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .card {
    border: 1px solid var(--border-soft); border-radius: var(--radius);
    padding: 15px 18px; margin: 12px 0;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    box-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset;
    transition: border-color .15s, transform .12s;
  }
  .card:hover { border-color: var(--border); transform: translateY(-1px); }
  .card h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; line-height: 1.45; }
  .meta { color: var(--text-dim); font-size: 12px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .grade { border-radius: 999px; padding: 1px 9px; font-size: 11px; font-weight: 600; }
  .grade.individual { background: rgba(248, 81, 73, .14); color: var(--individual); border: 1px solid rgba(248, 81, 73, .3); }
  .grade.batch { background: rgba(63, 185, 80, .12); color: var(--batch); border: 1px solid rgba(63, 185, 80, .3); }
  .pill { border-radius: 999px; padding: 1px 8px; font-size: 11px; background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border-soft); }
  .pill.type { color: var(--brand-2); border-color: rgba(77, 124, 255, .35); background: rgba(77, 124, 255, .1); }
  .pill.deprecated { color: #e3b98e; border-color: rgba(227, 185, 142, .35); background: rgba(227, 185, 142, .08); }
  .pill.status-deprecated { color: #e3b98e; border-color: rgba(227, 185, 142, .4); background: rgba(227, 185, 142, .1); }
  .summary { color: var(--text-dim); font-size: 13px; line-height: 1.55; margin: 2px 0 4px; }
  /* 二级菜单：一级页签之下的类型分类 */
  .subnav {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    margin: 0 0 16px; padding: 6px 8px 6px 12px;
    border: 1px solid var(--border-soft); border-left: 3px solid rgba(77, 124, 255, .55);
    border-radius: 10px; background: linear-gradient(180deg, rgba(26, 32, 48, .55), rgba(21, 26, 38, .35));
  }
  .subnav .navlbl {
    font-size: 11px; color: var(--text-faint); letter-spacing: .6px;
    text-transform: uppercase; margin-right: 6px; font-weight: 600;
  }
  .subitem {
    border: 1px solid transparent; background: none; color: var(--text-dim);
    border-radius: 8px; padding: 5px 11px; font-size: 13px; cursor: pointer;
    font-family: var(--font); display: flex; align-items: center; gap: 6px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .subitem:hover { color: var(--text); background: var(--panel-2); }
  .subitem.active {
    background: rgba(77, 124, 255, .16); border-color: rgba(77, 124, 255, .5);
    color: var(--brand-2); font-weight: 600;
  }
  .subitem .n {
    font-size: 11px; color: var(--text-faint); background: var(--bg-soft);
    border-radius: 999px; padding: 0 7px; min-width: 18px; text-align: center;
  }
  .subitem.active .n { color: var(--brand-2); background: rgba(77, 124, 255, .18); }
  .crumb { font-size: 12px; color: var(--text-faint); margin: -8px 0 14px 15px; }
  .crumb b { color: var(--text-dim); font-weight: 600; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .grow { flex: 1; }
  button {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    border-radius: 9px; padding: 7px 15px; cursor: pointer; font-size: 13px;
    font-family: var(--font); transition: background .15s, border-color .15s, transform .1s;
  }
  button:hover { background: #222a3d; border-color: #2d3650; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: linear-gradient(180deg, #3768e8, #2c56c8); border-color: #3a6df0; color: #fff; font-weight: 600; }
  button.primary:hover { background: linear-gradient(180deg, #4474f2, #335fd6); }
  button.danger { background: rgba(248, 81, 73, .1); border-color: rgba(248, 81, 73, .4); color: var(--danger); }
  button.danger:hover { background: rgba(248, 81, 73, .18); }
  button.ghost { background: none; border-color: transparent; color: var(--text-dim); }
  button.ghost:hover { color: var(--text); background: var(--panel-2); }
  input[type=text], textarea {
    background: var(--bg-soft); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 9px 12px; font-size: 13px; font-family: var(--font);
    outline: none; transition: border-color .15s;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--brand); }
  textarea { width: 100%; resize: vertical; line-height: 1.5; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 12px 0 5px; }
  .toolbar { display: flex; gap: 8px; margin: 0 0 16px; flex-wrap: wrap; align-items: center; }
  .chiprow { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 14px; align-items: center; }
  .chiprow .lbl { font-size: 11.5px; color: var(--text-faint); margin-right: 2px; letter-spacing: .4px; }
  .chip {
    border: 1px solid var(--border-soft); background: var(--panel); color: var(--text-dim);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer;
    font-family: var(--font); transition: border-color .15s, color .15s, background .15s;
  }
  .chip:hover { color: var(--text); border-color: var(--border); }
  .chip.active { background: rgba(77, 124, 255, .14); border-color: rgba(77, 124, 255, .5); color: var(--brand-2); font-weight: 600; }
  .chip .n { opacity: .65; margin-left: 4px; font-size: 11px; }
  .batchbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    border: 1px solid var(--border-soft); border-radius: var(--radius);
    padding: 10px 14px; margin: 4px 0 16px; background: linear-gradient(180deg, var(--panel-2), var(--panel));
  }
  .batchbar .selinfo { font-size: 12.5px; color: var(--text-dim); }
  .batchbar .selinfo b { color: var(--brand-2); }
  .card.selected { border-color: rgba(77, 124, 255, .55); box-shadow: 0 0 0 1px rgba(77, 124, 255, .25), var(--shadow); }
  .pick {
    width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer;
    flex-shrink: 0; margin-top: 2px;
  }
  .card .head { display: flex; gap: 12px; align-items: flex-start; }
  .card .head .body { flex: 1; min-width: 0; }
  .statline { display: flex; gap: 14px; color: var(--text-faint); font-size: 12px; margin: 0 0 14px; flex-wrap: wrap; }
  .statline b { color: var(--text-dim); font-weight: 600; }

  .empty {
    color: var(--text-faint); text-align: center; padding: 56px 0; font-size: 13.5px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .empty .big { font-size: 34px; opacity: .5; }
  .error-card { border: 1px solid rgba(248, 81, 73, .5); background: rgba(248, 81, 73, .08); }
  .error-card .err-title { color: var(--danger); font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .entryline {
    border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 10px 14px; cursor: pointer; display: flex; gap: 12px; align-items: center;
    margin: 8px 0; background: var(--panel); transition: border-color .15s, background .15s;
  }
  .entryline:hover { border-color: var(--border); background: var(--panel-2); }
  .entryline .id { color: var(--brand-2); font-size: 12px; min-width: 96px; font-variant-numeric: tabular-nums; }
  .entryline .title { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entryacts { display: flex; gap: 6px; flex-shrink: 0; }
  .mini {
    padding: 3px 10px; font-size: 11.5px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text-dim);
  }
  .mini:hover { color: var(--text); border-color: #2d3650; background: #222a3d; }
  .mini.danger { color: var(--danger); border-color: rgba(248, 81, 73, .35); background: rgba(248, 81, 73, .08); }
  .mini.danger:hover { background: rgba(248, 81, 73, .18); border-color: rgba(248, 81, 73, .55); }
  .detail pre {
    background: #0d1017; border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 14px; max-height: 340px; overflow: auto; font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.6; color: #b9c2d8;
  }
  .detail .path { color: var(--text-faint); font-size: 11.5px; margin: 8px 0 14px; word-break: break-all; }
  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--brand);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: #1c2436; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 18px; font-size: 13px; box-shadow: var(--shadow);
    z-index: 100; max-width: 70%;
  }
  .toast.err { border-color: rgba(248, 81, 73, .5); color: var(--danger); }
  .toast.ok { border-color: rgba(63, 185, 80, .5); color: var(--ok); }
  .hint { font-size: 12px; color: var(--text-faint); margin-top: 10px; line-height: 1.5; }
  @media (max-width: 640px) {
    header { padding: 14px 16px; }
    nav { padding: 0 12px; }
    main { padding: 16px 12px 60px; }
    .status { max-width: 45%; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>/*__REACT__*/</script>
<script>/*__REACT_DOM__*/</script>
<script>/*__HTM__*/</script>
<script>
'use strict';
/* eslint-disable */
const { useState, useEffect, useCallback, useMemo } = React;
const html = htm.bind(React.createElement);
const FETCH_TIMEOUT = 12000;

async function j(url, opts) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT);
  try {
    const r = await fetch(url, { ...(opts ?? {}), signal: ctrl.signal });
    return { ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) };
  } catch (e) {
    const timedOut = e && e.name === 'AbortError';
    return { ok: false, status: 0, timedOut, data: { error: timedOut ? '请求超时（服务忙，已跳过渲染等待）' : String(e && e.message ? e.message : e) } };
  } finally { clearTimeout(timer); }
}

// ---- shared bits ---------------------------------------------------------
function GradeBadge({ grade }) {
  return html`<span className=${'grade ' + (grade === 'individual' ? 'individual' : 'batch')}>${grade === 'individual' ? '逐条审批' : '可批量'}</span>`;
}
function Empty({ icon, text }) {
  return html`<div className="empty"><span className="big">${icon}</span><span>${text}</span></div>`;
}
function Loading() {
  return html`<div className="empty"><div className="spinner"></div><span>加载中…</span></div>`;
}
function ErrorCard({ title, detail, onRetry }) {
  return html`
    <div className="card error-card">
      <div className="err-title">⚠ ${title}</div>
      <div className="summary">${detail ?? ''}</div>
      ${onRetry ? html`<div className="row"><button onClick=${onRetry}>重试</button></div>` : null}
    </div>`;
}

// ---- 类型标签（三级筛选，不再作为二级菜单）--------------------------------
const TYPE_LABELS = {
  decision: '决策',
  constraint: '约束',
  knowledge: '知识',
  process: '流程',
  'api-catalog': 'API 目录',
  'runtime-base': '运行时基线',
  'open-questions': '待解问题',
  playbooks: '操作手册',
  assets: '资产',
};
const TYPE_ORDER = ['decision', 'constraint', 'knowledge', 'process', 'api-catalog', 'runtime-base', 'open-questions', 'playbooks', 'assets'];
function typeOf(item) {
  return item.type === null || item.type === undefined || item.type === '' ? '__none__' : item.type;
}
function typeLabel(t) {
  if (t === '__none__') return '未分类型';
  return TYPE_LABELS[t] ?? t;
}
function typeBuckets(items) {
  const counts = new Map();
  for (const it of items) {
    const k = typeOf(it);
    counts.set(k, (counts.get(k) ?? 0) + 1);
  }
  const known = TYPE_ORDER.filter((t) => counts.has(t));
  const rest = [...counts.keys()].filter((t) => !TYPE_ORDER.includes(t) && t !== '__none__').sort();
  const keys = [...known, ...rest];
  if (counts.has('__none__')) keys.push('__none__');
  return keys.map((k) => ({ key: k, label: typeLabel(k), count: counts.get(k) }));
}

// ---- 二级菜单：状态 -------------------------------------------------------
// 一级页签「记忆库」决定看哪个库，二级菜单按状态分。状态集合以落库数据为准：
// 已知状态给出中文名与固定顺序，出现未知状态时自动追加，绝不静默隐藏数据。
// 本项目没有「域」概念，域相关筛选已移除。
const STATUS_LABELS = {
  all: '全部',
  pending: '待审核',
  accepted: '已审核',
  superseded: '已取代',
  deprecated: '已废弃',
  rejected: '已拒绝',
  candidate: '候选',
};
const STATUS_ORDER = ['all', 'pending', 'accepted', 'superseded', 'deprecated', 'rejected', 'candidate'];
// 核心状态常驻显示（即使 0 条），这样「已废弃」等入口不会因为暂时没数据而消失，
// 用户可以随时点进去做清理；其余状态有数据才出现，未知状态自动追加。
const STATUS_ALWAYS = ['all', 'pending', 'accepted', 'deprecated'];
function StatusNav({ active, counts, onPick }) {
  const keys = STATUS_ORDER.filter((k) => STATUS_ALWAYS.includes(k) || counts[k] > 0);
  const extra = Object.keys(counts).filter((k) => !STATUS_ORDER.includes(k) && counts[k] > 0).sort();
  return html`
    <div className="subnav">
      <span className="navlbl">状态</span>
      ${[...keys, ...extra].map((k) => html`
        <button key=${k} className=${'subitem ' + (active === k ? 'active' : '')} onClick=${() => onPick(k)}>
          ${STATUS_LABELS[k] ?? k}<span className="n">${counts[k] ?? 0}</span>
        </button>`)}
    </div>`;
}
function Crumb({ parent, label }) {
  return html`<div className="crumb">${parent} / <b>${label}</b></div>`;
}

// ---- 记忆库（待审核 + 已审核 + 已废弃 合并在一个分层视图里）----------------
function MemoryPane({ navCount }) {
  const [q, setQ] = useState('');
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);
  const [pending, setPending] = useState([]); // 待审核提案
  const [entries, setEntries] = useState([]); // 已落库条目（accepted / deprecated）
  const [statusFilter, setStatusFilter] = useState('all');
  const [typeFilter, setTypeFilter] = useState('all');
  const [selected, setSelected] = useState(() => new Set());
  const [detail, setDetail] = useState(null); // { id, frontmatter, body, path }
  const [editing, setEditing] = useState(false);
  const [summary, setSummary] = useState('');
  const [body, setBody] = useState('');
  const [reason, setReason] = useState('');

  const toast = (msg, kind) => {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind === 'err' ? 'err' : kind === 'ok' ? 'ok' : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3600);
  };

  const refresh = useCallback(async () => {
    setLoading(true); setErr(null);
    const [ib, en] = await Promise.all([j('/api/inbox'), j('/api/entries')]);
    if (!ib.ok && !en.ok) {
      setErr({ title: '记忆库加载失败', detail: ib.data?.error ?? en.data?.error ?? ('HTTP ' + ib.status) });
      setLoading(false);
      return;
    }
    const proposals = ib.ok ? (ib.data.proposals ?? []) : [];
    setPending(proposals);
    setEntries(en.ok ? (en.data.entries ?? []) : []);
    setLoading(false);
    // 已不存在的选中项（已被批准/拒绝）自动剔除
    setSelected((prev) => {
      const live = new Set(proposals.map((p) => p.id));
      const next = new Set([...prev].filter((id) => live.has(id)));
      return next.size === prev.size ? prev : next;
    });
  }, []);
  useEffect(() => { refresh(); }, [refresh]);
  useEffect(() => { if (navCount) navCount(pending.length); }, [pending.length]);

  const approveOne = async (id) => {
    const r = await j('/api/inbox/' + id + '/approve', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
    if (!r.ok) {
      const hint = r.data?.hint || r.data?.details?.hint;
      toast('批准失败：' + (r.data?.error ?? ('HTTP ' + r.status)) + (hint ? '\n' + hint : ''), 'err');
    } else { toast('已批准 ' + id, 'ok'); }
    refresh();
  };
  const rejectOne = async (id) => {
    const r = await j('/api/inbox/' + id + '/reject', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
    if (!r.ok) toast('拒绝失败：' + (r.data?.error ?? ('HTTP ' + r.status)), 'err');
    else toast('已拒绝 ' + id, 'ok');
    refresh();
  };

  // 只批用户显式勾选的条目，绝不隐式批量
  const toggle = (id) => setSelected((prev) => {
    const next = new Set(prev);
    if (next.has(id)) next.delete(id); else next.add(id);
    return next;
  });
  const approveSelected = async () => {
    const ids = [...selected];
    if (ids.length === 0) { toast('请先勾选要批准的条目', 'err'); return; }
    const r = await j('/api/inbox/approve', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ids }) });
    if (!r.ok) toast('批量批准失败：' + (r.data?.error ?? ('HTTP ' + r.status)), 'err');
    else { toast('已批准选中的 ' + ids.length + ' 条', 'ok'); setSelected(new Set()); }
    refresh();
  };

  const doSearch = async () => {
    if (!q.trim()) { refresh(); return; }
    setLoading(true); setErr(null); setDetail(null);
    const r = await j('/api/search?q=' + encodeURIComponent(q.trim()));
    if (!r.ok) { setErr({ title: '搜索失败', detail: r.data?.error ?? ('HTTP ' + r.status) }); setLoading(false); return; }
    setEntries(r.data.hits.map((h) => ({ id: h.id, title: h.title, type: h.type, status: h.status, version: h.version })));
    setLoading(false);
  };
  const openEntry = async (id) => {
    const r = await j('/api/entries/' + encodeURIComponent(id));
    if (!r.ok) { toast('打开失败：' + (r.data?.error ?? ('HTTP ' + r.status)), 'err'); return; }
    setDetail({ id, frontmatter: r.data.frontmatter ?? {}, body: r.data.body ?? '', path: r.data.path ?? '' });
    setEditing(false);
  };
  const startEdit = () => { setSummary(detail.frontmatter.summary ?? ''); setBody(detail.body); setEditing(true); setReason(''); };
  const saveEntry = async () => {
    const r = await j('/api/entries/' + encodeURIComponent(detail.id) + '/update', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ summary, body }) });
    if (!r.ok) { toast('保存失败：' + (r.data?.error ?? ('HTTP ' + r.status)), 'err'); return; }
    toast('已保存 ' + detail.id + ' → v' + (r.data.version ?? '?'), 'ok');
    setEditing(false);
    refresh();
    openEntry(detail.id);
  };
  const deprecateEntry = async () => {
    if (!reason.trim()) { toast('请填写废弃原因', 'err'); return; }
    const r = await j('/api/entries/' + encodeURIComponent(detail.id) + '/deprecate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ reason }) });
    if (!r.ok) { toast('废弃失败：' + (r.data?.error ?? ('HTTP ' + r.status)), 'err'); return; }
    toast('已废弃 ' + detail.id, 'ok');
    refresh();
    openEntry(detail.id);
  };
  const restoreDetail = async () => {
    const reason = reason.trim() || '恢复为已审核';
    const r = await j('/api/entries/' + encodeURIComponent(detail.id) + '/restore', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ reason }) });
    if (!r.ok) { toast('恢复失败：' + (r.data?.error ?? ('HTTP ' + r.status)), 'err'); return; }
    toast('已恢复 ' + detail.id + ' → 已审核', 'ok');
    refresh();
    openEntry(detail.id);
  };
  const hardDelete = async () => {    if (!window.confirm('永久删除 ' + detail.id + ' 不可恢复，确认？')) return;
    if (!reason.trim()) { toast('请填写删除原因', 'err'); return; }
    const r = await j('/api/entries/' + encodeURIComponent(detail.id) + '/delete', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ reason }) });
    if (!r.ok) { toast('删除失败：' + (r.data?.error ?? ('HTTP ' + r.status)), 'err'); return; }
    toast('已永久删除 ' + detail.id + '（账本留痕）', 'ok');
    setDetail(null); setEditing(false);
    refresh();
  };

  // 行内操作：不打开详情面板也能处理，理由现填现用（更自由）。
  const deprecateInline = async (ev, item) => {
    ev.stopPropagation();
    const why = window.prompt('废弃 ' + item.id + '「' + item.title + '」的原因（必填）：', '');
    if (why === null) return; // 用户取消
    if (!why.trim()) { toast('请填写废弃原因', 'err'); return; }
    const r = await j('/api/entries/' + encodeURIComponent(item.id) + '/deprecate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ reason: why.trim() }) });
    if (!r.ok) { toast('废弃失败：' + (r.data?.error ?? ('HTTP ' + r.status)), 'err'); return; }
    toast('已废弃 ' + item.id, 'ok');
    refresh();
  };
  const deleteInline = async (ev, item) => {
    ev.stopPropagation();
    if (!window.confirm('永久删除 ' + item.id + '「' + item.title + '」，不可恢复，确认？')) return;
    const why = window.prompt('删除 ' + item.id + ' 的原因（必填，写入账本）：', '');
    if (why === null) return;
    if (!why.trim()) { toast('请填写删除原因', 'err'); return; }
    const r = await j('/api/entries/' + encodeURIComponent(item.id) + '/delete', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ reason: why.trim() }) });
    if (!r.ok) { toast('删除失败：' + (r.data?.error ?? ('HTTP ' + r.status)), 'err'); return; }
    toast('已永久删除 ' + item.id + '（账本留痕）', 'ok');
    if (detail && detail.id === item.id) { setDetail(null); setEditing(false); }
    refresh();
  };
  const restoreInline = async (ev, item) => {
    ev.stopPropagation();
    const why = window.prompt('恢复 ' + item.id + '「' + item.title + '」为已审核，原因（可留空）：', '');
    if (why === null) return; // 用户取消
    const reason = why.trim() || '恢复为已审核';
    const r = await j('/api/entries/' + encodeURIComponent(item.id) + '/restore', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ reason }) });
    if (!r.ok) { toast('恢复失败：' + (r.data?.error ?? ('HTTP ' + r.status)), 'err'); return; }
    toast('已恢复 ' + item.id + ' → 已审核', 'ok');
    refresh();
  };

  const pendingItems = pending.map((p) => ({ ...p, kind: 'pending' }));
  const entryItems = entries.map((e) => ({ ...e, kind: 'entry' }));
  const counts = { all: pendingItems.length + entryItems.length, pending: pendingItems.length };
  for (const e of entryItems) {
    const s = e.status ?? 'accepted';
    counts[s] = (counts[s] ?? 0) + 1;
  }
  let statusItems;
  if (statusFilter === 'pending') statusItems = pendingItems;
  else if (statusFilter === 'all') statusItems = [...pendingItems, ...entryItems];
  else statusItems = entryItems.filter((e) => (e.status ?? 'accepted') === statusFilter);

  const buckets = typeBuckets(statusItems);
  const visible = typeFilter === 'all' ? statusItems : statusItems.filter((it) => typeOf(it) === typeFilter);
  const visiblePending = visible.filter((it) => it.kind === 'pending');
  const allPendingSelected = visiblePending.length > 0 && visiblePending.every((p) => selected.has(p.id));
  const toggleSelectAll = () => {
    if (allPendingSelected) {
      setSelected((prev) => { const next = new Set(prev); for (const p of visiblePending) next.delete(p.id); return next; });
    } else {
      setSelected((prev) => { const next = new Set(prev); for (const p of visiblePending) next.add(p.id); return next; });
    }
  };
  const individualPicked = pendingItems.filter((p) => selected.has(p.id) && p.grade === 'individual').length;
  const statusLabel = STATUS_LABELS[statusFilter] ?? statusFilter;
  const activeCrumb = typeFilter === 'all' ? statusLabel : statusLabel + ' · ' + typeLabel(typeFilter);

  if (loading && pending.length === 0 && entries.length === 0) return html`<${Loading} />`;
  if (err) return html`<${ErrorCard} title=${err.title} detail=${err.detail} onRetry=${refresh} />`;

  return html`
    <div>
      <div className="toolbar">
        <input type="text" className="grow" placeholder="BM25 检索记忆库…（Enter 搜索）" value=${q}
          onChange=${(e) => setQ(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') doSearch(); }} />
        <button onClick=${doSearch}>搜索</button>
        <button onClick=${refresh}>刷新</button>
      </div>

      <${StatusNav} active=${statusFilter} counts=${counts} onPick=${setStatusFilter} />
      <${Crumb} parent="记忆库" label=${activeCrumb} />

      ${buckets.length > 1 ? html`
        <div className="chiprow">
          <span className="lbl">类型</span>
          <button className=${'chip ' + (typeFilter === 'all' ? 'active' : '')} onClick=${() => setTypeFilter('all')}>全部<span className="n">${statusItems.length}</span></button>
          ${buckets.map((b) => html`<button key=${b.key} className=${'chip ' + (typeFilter === b.key ? 'active' : '')} onClick=${() => setTypeFilter(b.key)}>${b.label}<span className="n">${b.count}</span></button>`)}
        </div>` : null}

      ${visiblePending.length > 0 ? html`
        <div className="batchbar">
          <label style=${{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, color: 'var(--text-dim)', cursor: 'pointer' }}>
            <input type="checkbox" className="pick" checked=${allPendingSelected} onChange=${toggleSelectAll} />
            全选当前视图（${visiblePending.length}）
          </label>
          <span className="selinfo">已选 <b>${selected.size}</b> 条${individualPicked > 0 ? ' · 其中逐条级 ' + individualPicked + ' 条' : ''}</span>
          <button className="primary" onClick=${approveSelected} disabled=${selected.size === 0}>批量批准选中的 ${selected.size} 条</button>
          <button className="ghost" onClick=${() => setSelected(new Set())} disabled=${selected.size === 0}>清除选择</button>
        </div>` : null}

      ${visible.length === 0 ? html`<${Empty} icon=${statusFilter === 'deprecated' ? '🗑' : '🔎'}
          text=${statusFilter === 'deprecated'
            ? '没有已废弃的条目（废弃后的记忆会出现在这里，可再永久删除）'
            : statusFilter === 'pending' ? '没有待审核条目' : '该状态下没有条目'} />` : visible.map((it) => it.kind === 'pending' ? html`
        <div className=${'card ' + (selected.has(it.id) ? 'selected' : '')} key=${it.id}>
          <div className="head">
            <input type="checkbox" className="pick" checked=${selected.has(it.id)} onChange=${() => toggle(it.id)} title="勾选后可批量批准" />
            <div className="body">
              <h3>${it.title}</h3>
              <div className="meta">
                <span className="pill">${it.id}</span>
                <span className="pill type">${typeLabel(typeOf(it))}</span>
                <${GradeBadge} grade=${it.grade} />
                ${it.tags && it.tags.length ? it.tags.map((t) => html`<span className="pill" key=${t}>#${t}</span>`) : null}
              </div>
              ${it.summary ? html`<div className="summary">${it.summary}</div>` : null}
              <div className="row">
                <button className="primary" onClick=${() => approveOne(it.id)}>批准</button>
                <button className="danger" onClick=${() => rejectOne(it.id)}>拒绝</button>
              </div>
            </div>
          </div>
        </div>` : html`
        <div className="entryline" key=${it.id} onClick=${() => openEntry(it.id)}>
          <span className="id">${it.id}@v${it.version ?? '?'}</span>
          <span className="title">${it.title}</span>
          ${it.status === 'deprecated'
            ? html`<span className="pill status-deprecated">已废弃</span>`
            : it.status === 'superseded' ? html`<span className="pill status-deprecated">已取代</span>` : null}
          <span className="pill type">${typeLabel(typeOf(it))}</span>
          <span className="entryacts">
            ${it.status === 'deprecated'
              ? html`<button className="mini" title="恢复为已审核" onClick=${(ev) => restoreInline(ev, it)}>恢复</button>
                     <button className="mini danger" title="永久删除这条已废弃记忆" onClick=${(ev) => deleteInline(ev, it)}>删除</button>`
              : html`<button className="mini" title="手动废弃这条已审核记忆" onClick=${(ev) => deprecateInline(ev, it)}>废弃</button>`}
          </span>
        </div>`)}

      ${detail ? html`
        <div className="card detail" style=${{ marginTop: 18 }}>
          ${editing ? html`
            <h3>编辑 ${detail.id}（保存 = v${(detail.frontmatter.version ?? 1) + 1}，旧版本进 history/）</h3>
            <label>摘要</label>
            <textarea rows="3" value=${summary} onChange=${(e) => setSummary(e.target.value)}></textarea>
            <label>正文</label>
            <textarea rows="14" value=${body} onChange=${(e) => setBody(e.target.value)}></textarea>
            <div className="row">
              <button className="primary" onClick=${saveEntry}>保存为新版本</button>
              <button onClick=${() => setEditing(false)}>取消</button>
            </div>` : html`
            <h3>${detail.frontmatter.title} <span className="pill">${detail.frontmatter.status ?? ''}</span></h3>
            <div className="meta">
              <span className="pill">${detail.frontmatter.id}@v${detail.frontmatter.version}</span>
              <span className="pill type">${typeLabel(typeOf(detail.frontmatter))}</span>
              ${(detail.frontmatter.tags ?? []).map((t) => html`<span className="pill" key=${t}>#${t}</span>`)}
            </div>
            <div className="path">path: ${detail.path}</div>
            <pre>${detail.body}</pre>
            <label>废弃 / 删除原因（必填）</label>
            <input type="text" value=${reason} onChange=${(e) => setReason(e.target.value)} placeholder="填写后操作" />
            <div className="row">
              <button className="primary" onClick=${startEdit}>编辑（重新萃取）</button>
              ${detail.frontmatter.status === 'deprecated'
                ? html`<button onClick=${restoreDetail}>恢复为已审核</button>
                       <button className="danger" onClick=${hardDelete}>永久删除（不可恢复）</button>`
                : html`<button className="danger" onClick=${deprecateEntry}>废弃（软删除）</button>
                       <button className="danger" onClick=${hardDelete}>永久删除（不可恢复）</button>`}
              <button onClick=${() => setDetail(null)}>关闭</button>
            </div>`}
        </div>` : null}
    </div>`;
}

// ---- audit ---------------------------------------------------------------
function AuditPane() {
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);
  const [ledger, setLedger] = useState(null);   // { records, total }
  const [journal, setJournal] = useState(null); // { entries }

  const loadLedger = async () => {
    setLoading(true); setErr(null);
    const r = await j('/api/ledger');
    if (!r.ok) { setErr({ title: '账本加载失败', detail: r.data?.error ?? ('HTTP ' + r.status) }); setLoading(false); return; }
    setLedger(r.data); setLoading(false);
  };
  const loadJournal = async () => {
    setLoading(true); setErr(null);
    const r = await j('/api/journal');
    if (!r.ok) { setErr({ title: '情景日志加载失败', detail: r.data?.error ?? ('HTTP ' + r.status) }); setLoading(false); return; }
    setJournal(r.data); setLoading(false);
  };

  return html`
    <div>
      <div className="toolbar">
        <button onClick=${loadLedger}>刷新账本</button>
        <button onClick=${loadJournal}>刷新情景日志</button>
      </div>
      ${loading ? html`<${Loading} />` : err ? html`<${ErrorCard} title=${err.title} detail=${err.detail} onRetry=${() => { loadLedger(); loadJournal(); }} />` : html`
        <div>
          ${ledger ? html`<div className="card"><h3>账本事件（最近 ${ledger.records.length} / 共 ${ledger.total ?? 0}）</h3><pre>${JSON.stringify(ledger.records, null, 2)}</pre></div>` : null}
          ${journal ? html`<div className="card"><h3>情景日志（最近 ${journal.entries.length}）</h3><pre>${JSON.stringify(journal.entries, null, 2)}</pre></div>` : null}
          ${!ledger && !journal ? html`<${Empty} icon="🕒" text="点击上方按钮加载账本与情景日志" />` : null}
        </div>`}
    </div>`;
}

// ---- app shell -----------------------------------------------------------
function App() {
  const [tab, setTab] = useState('library');
  const [pendingCount, setPendingCount] = useState(null);
  const [status, setStatus] = useState(null);

  useEffect(() => {
    j('/api/status').then((r) => { if (r.ok) setStatus(r.data); });
  }, []);

  const statusText = status
    ? (status.workspace ? status.workspace.workspaceId + (status.workspace.exact ? '' : ' (synthetic)') : '?') +
      ' · accepted ' + (status.acceptedCount ?? 0) + ' · ' + (status.hubRoot ?? '?')
    : '连接中…';

  return html`
    <div>
      <header>
        <div className="brand">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="url(#g)" stroke="#3a6df0" strokeOpacity=".6"/>
            <path d="M11 10h10M11 16h10M11 22h6" stroke="#fff" strokeWidth="2.4" strokeLinecap="round"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stopColor="#2c56c8"/><stop offset="1" stopColor="#16224a"/></linearGradient></defs>
          </svg>
          <h1>memhub <span className="sub">console</span></h1>
        </div>
        <div className="status" title=${statusText}>${statusText}</div>
      </header>
      <nav>
        <button className=${tab === 'library' ? 'active' : ''} onClick=${() => setTab('library')}>
          记忆库 ${pendingCount !== null && pendingCount > 0 ? html`<span className="count">${pendingCount}</span>` : null}
        </button>
        <button className=${tab === 'audit' ? 'active' : ''} onClick=${() => setTab('audit')}>审计</button>
      </nav>
      <main>
        <div className=${'tabpane ' + (tab === 'library' ? 'active' : '')}><${MemoryPane} navCount=${setPendingCount} /></div>
        <div className=${'tabpane ' + (tab === 'audit' ? 'active' : '')}><${AuditPane} /></div>
      </main>
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
